[project]
name = "vkpw"
version = "0.1.0"
description = "Получение cookies ВКонтакте через браузерный вход VK ID"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["playwright>=1.50,<2"]

[project.scripts]
vkpw = "vkpw.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
